services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: featly
      POSTGRES_PASSWORD: featly
      POSTGRES_DB: featly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U featly"]
      interval: 5s
      timeout: 5s
      retries: 5

  hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    ports:
      - "8000:8000"
    environment:
      FEATLY_DATABASE_URL: postgresql+asyncpg://featly:featly@postgres:5432/featly
      FEATLY_WS_SECRET: ${WS_SECRET:-change-me-in-production}
      FEATLY_API_KEY: ${FEATLY_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
